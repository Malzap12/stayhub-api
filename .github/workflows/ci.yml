name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lr_user
          POSTGRES_PASSWORD: lr_password123
          POSTGRES_DB: inversiones_lr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile project (HU-064)
        run: npm run build

      - name: Run automated tests with coverage (HU-064)
        run: npm run test:cov
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: lr_user
          TEST_DATABASE_PASSWORD: lr_password123
          TEST_DATABASE_NAME: inversiones_lr_db

      - name: SonarCloud Scan (HU-065)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.MIGUEL_ALZA || secrets.SONAR_TOKEN }}
